name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # The runner image already carries the Android SDK, so the build downloads the
      # platform and build-tools it needs itself. `android-actions/setup-android` is not
      # used here: its licence step fails on the hosted image ("sdkmanager --licenses"
      # exits 1) and takes the whole job down in twenty seconds.
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify the APK is signed
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | head -1)
          fi
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nijatva-gallery-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
