name: pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gh-pages holds a copy of web/ so the page has a URL without any build step.
      # This job is what keeps the copy honest: edit web/index.html on main and the
      # published page follows.
      - name: Publish web/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          exclude_assets: 'test/**'
          commit_message: 'web: publish from ${{ github.sha }}'
